<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonderland Prophecy — Stage View</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (utility classes saja, no build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GSAP 3 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- STAGE: design canvas 1920x1080, di-scale via JS untuk fit viewport -->
  <div id="stage">

    <!-- System Check scene (Fase 1 — verifikasi pipeline) -->
    <section class="scene" id="scene-system-check">
      <img class="scene__bg"
           src="assets/img/common/b0-01-opening-title-screen.png"
           alt="">
      <div class="scene__overlay"></div>

      <div class="system-check">
        <h1 class="system-check__title">STAGE READY</h1>
        <p class="system-check__subtitle">System Check — Wonderland Prophecy</p>
        <p class="system-check__hint">
          <span><kbd>SPACE</kbd> test audio</span>
          <span><kbd>F</kbd> fullscreen</span>
        </p>
      </div>
    </section>

  </div>

  <!-- Debug HUD (di luar stage, tidak ikut scale) -->
  <div id="debug-hud">scale: – · –×–</div>

  <!-- Scripts: constants → engine → app (urutan dependensi) -->
  <script src="js/constants.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
