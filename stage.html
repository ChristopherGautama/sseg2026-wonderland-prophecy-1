<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wonderland Prophecy — Stage View</title>
  <link rel="stylesheet" href="css/stage.css" />
  <!-- GSAP CDN: belum dipakai di Fase A, disiapkan untuk fase berikutnya -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>
<body>
  <!-- Lapisan background: 2 slot ping-pong untuk crossfade -->
  <div id="bg-layer">
    <div class="bg-slot"></div>
    <div class="bg-slot"></div>
  </div>

  <!-- Vignette sinematik (coded, bukan gambar) -->
  <div id="vignette"></div>

  <!-- Safe-area 1920x1080, di-scale via JS. Fase B: panel + timer + wizco. -->
  <div id="stage">
    <!-- Maskot Wizco (kiri-bawah) -->
    <img id="wizco" alt="" />

    <!-- Fase C1 — Kartu BESAR showcase (tengah-atas) -->
    <div id="card-showcase"></div>

    <!-- Fase C1 — Barisan kartu kecil di slot (bawah, di atas panel) -->
    <div id="card-slots"></div>

    <!-- Timer emas (kanan-atas) -->
    <div id="timer">00:00</div>

    <!-- Panel soal (tengah-bawah) -->
    <div id="panel">
      <img class="panel-crest" src="assets/img/ui/ornament-crest-top.png" alt="" />
      <div class="panel-sub"></div>
      <h1 class="panel-title"></h1>
      <img class="panel-divider" src="assets/img/ui/ornament-divider.png" alt="" />
      <p class="panel-scenario"></p>
      <div class="panel-meta"></div>
    </div>
  </div>

  <!-- Loading screen saat preload aset -->
  <div id="loading-screen">
    <div class="loading-title">Loading…</div>
    <div id="loading-progress" class="loading-progress">0 / 0</div>
  </div>

  <!-- Label scene pojok kiri-atas -->
  <div id="scene-label"></div>

  <!-- Hint kontrol pojok kanan-bawah -->
  <div id="hud-hint">Space ▶ · ← Mundur · F ⛶ · ? Bantuan</div>

  <!-- Overlay bantuan -->
  <div id="help-overlay" class="hidden"></div>

  <!-- Urutan penting: config dulu (data), baru engine (logika) -->
  <script src="js/config.js"></script>
  <script src="js/stage.js"></script>
</body>
</html>
