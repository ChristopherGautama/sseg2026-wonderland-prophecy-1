<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonderland Prophecy — Stage View</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (utility classes saja, no build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GSAP 3 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- STAGE: design canvas 1920x1080. SceneManager append <section.scene> di sini. -->
  <div id="stage"></div>

  <!-- Help overlay operator (toggle pakai H) — di luar #stage supaya tidak ikut scale -->
  <div id="help-overlay" class="help-overlay" aria-hidden="true">
    <div class="help-overlay__panel">
      <div class="help-overlay__title">OPERATOR HOTKEYS</div>
      <table class="help-overlay__list">
        <tr><th>SPACE / →</th><td>Next step · next scene</td></tr>
        <tr><th>←</th><td>Previous scene</td></tr>
        <tr><th>R</th><td>Reveal (untuk scene ronde)</td></tr>
        <tr><th>F</th><td>Fullscreen toggle</td></tr>
        <tr><th>M</th><td>Mute / unmute musik</td></tr>
        <tr><th>H</th><td>Sembunyikan menu ini</td></tr>
        <tr><th>Esc</th><td>Keluar fullscreen</td></tr>
      </table>
    </div>
  </div>

  <!-- Debug HUD (di luar stage, tidak ikut scale) -->
  <div id="debug-hud">scale: – · –×–</div>

  <!-- Scripts: data → engine → scene-manager → scenes → app (urutan dependensi) -->
  <script src="js/constants.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/scene-manager.js"></script>
  <script src="js/scenes/opening.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
