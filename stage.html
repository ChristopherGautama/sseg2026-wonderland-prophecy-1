<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wonderland Prophecy — Stage View</title>
  <link rel="stylesheet" href="css/stage.css" />
  <!-- GSAP CDN: belum dipakai di Fase A, disiapkan untuk fase berikutnya -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>
<body>
  <!-- Lapisan background: 2 slot ping-pong untuk crossfade -->
  <div id="bg-layer">
    <div class="bg-slot"></div>
    <div class="bg-slot"></div>
  </div>

  <!-- Vignette sinematik (coded, bukan gambar) -->
  <div id="vignette"></div>

  <!-- Safe-area 1920x1080, di-scale via JS. Fase B: panel + timer + wizco. -->
  <div id="stage">
    <!-- V11 Fase 4 — Overlay krisis merah (HANYA R5; di-toggle via .crimson-crisis-mode di #stage).
         DOM sebelum #board → kartu showcase (z5) tetap menang di atas vignette. -->
    <div id="crimson-crisis"><div class="crisis-vignette"></div></div>

    <!-- Maskot Wizco (kiri-bawah) -->
    <img id="wizco" alt="" />

    <!-- FASE 2 (v10) — Opening cinematic overlay (hanya scene opening) -->
    <div id="opening">
      <img class="op-glow" src="assets/img/shared/glow-gold.png" alt="" />
      <div class="op-particles"></div>
      <div class="op-title"></div>
      <div class="op-sweep"></div>
    </div>

    <!-- FASE 3 (v10) — Closing title screen (hanya scene closing) -->
    <div id="closing">
      <img class="cl-glow" src="assets/img/shared/glow-gold.png" alt="" />
      <div class="cl-particles"></div>
      <div class="cl-title">
        <div class="cl-sub">Thank You, Oracles of Lyndell</div>
        <div class="cl-headline">
          <img class="cl-flank" src="assets/img/ui/icon-crystal-ball.png" alt="" />
          <h1 class="cl-maintitle">THE PROPHECY IS COMPLETE</h1>
          <img class="cl-flank" src="assets/img/ui/icon-crown.png" alt="" />
        </div>
        <div class="cl-caption">SSEG 2026 · Wonderland Prophecy</div>
        <img class="cl-divider" src="assets/img/ui/ornament-divider.png" alt="" />
      </div>
      <div class="cl-sweep"></div>
    </div>

    <!-- FASE 4 (v10) — Transition title screen (R1–R9 + Bonus; konten diisi JS) -->
    <div id="transition">
      <img class="tr-glow" src="assets/img/shared/glow-gold.png" alt="" />
      <div class="tr-particles"></div>
      <div class="tr-title">
        <div class="tr-sub"></div>
        <div class="tr-round"></div>
        <div class="tr-of"></div>
        <div class="tr-name"></div>
      </div>
    </div>

    <!-- FASE 5 (v10) — Papan soal (board) 2-state: A=papan masuk · B=diskusi -->
    <div id="board">
      <div class="board-dim"></div>
      <img class="board-panel" alt="" />
      <div class="soal-cards"></div>
      <!-- V11 Fase 3 — overlay gelap saat showcase kartu (di atas bg+panel+band, di bawah kartu aktif) -->
      <div class="soal-dark"></div>
      <div class="soal-showcase"></div>
      <img class="soal-celebrate" alt="" />
    </div>

    <!-- Fase C1 — Kartu BESAR showcase (tengah-atas) -->
    <div id="card-showcase"></div>

    <!-- Fase C1 — Barisan kartu kecil di slot (bawah, di atas panel) -->
    <div id="card-slots"></div>

    <!-- Timer emas (kanan-atas) -->
    <div id="timer">00:00</div>

    <!-- Panel soal (tengah-bawah) -->
    <div id="panel">
      <img class="panel-crest" src="assets/img/ui/ornament-crest-top.png" alt="" />
      <div class="panel-sub"></div>
      <h1 class="panel-title"></h1>
      <img class="panel-divider" src="assets/img/ui/ornament-divider.png" alt="" />
      <p class="panel-scenario"></p>
      <div class="panel-meta"></div>
    </div>
  </div>

  <!-- Loading screen saat preload aset -->
  <div id="loading-screen">
    <div class="loading-title">Loading…</div>
    <div id="loading-progress" class="loading-progress">0 / 0</div>
  </div>

  <!-- Label scene pojok kiri-atas -->
  <div id="scene-label"></div>

  <!-- Hint kontrol pojok kanan-bawah -->
  <div id="hud-hint">Space ▶ · ← Mundur · F ⛶ · ? Bantuan</div>

  <!-- Overlay bantuan -->
  <div id="help-overlay" class="hidden"></div>

  <!-- Urutan penting: config dulu (data), baru engine (logika) -->
  <script src="js/config.js"></script>
  <script src="js/stage.js"></script>
</body>
</html>
